<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FinSolve Voice Agent — Demo</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 80px auto;
      padding: 0 24px;
      color: #1a1a1a;
    }
    h1 { font-size: 1.5rem; }
    p { color: #555; line-height: 1.5; }
    code {
      background: #f2f2f2;
      padding: 2px 6px;
      border-radius: 4px;
    }
    #warmup-status {
      margin: 16px 0;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      background: #fff3cd;
      color: #856404;
    }
    #warmup-status.ready {
      background: #d4edda;
      color: #155724;
    }
  </style>
</head>
<body>
  <h1>FinSolve Voice Agent — Demo</h1>
  <p>
    Click the call button in the bottom-right corner to talk to FinSolve's
    customer support voice agent. Ask about business hours, a transaction
    (try <code>TXN10005</code>), or request a callback.
  </p>

  <div id="warmup-status">Warming up the backend…</div>

  <elevenlabs-convai agent-id="agent_7701m3snz3jyfnptfjd05bew1mxv"></elevenlabs-convai>
  <script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async type="text/javascript"></script>

  <script>
    const HEALTH_URL = "https://finsolve-voice-agent-api.blackhill-3f2c9dd4.eastus.azurecontainerapps.io/health";
    const statusEl = document.getElementById("warmup-status");

    async function warmUp() {
      try {
        const res = await fetch(HEALTH_URL);
        if (res.ok) {
          statusEl.textContent = "Backend is ready — go ahead and start a call.";
          statusEl.classList.add("ready");
          return;
        }
      } catch (e) {
        // Container still starting up, or a network hiccup -- just retry.
      }
      setTimeout(warmUp, 3000);
    }

    warmUp();
  </script>
</body>
</html>
